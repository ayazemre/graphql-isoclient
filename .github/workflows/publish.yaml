name: Publish
on:
  workflow_call:
    inputs:
      registry:
        description: Target registry for the package
        required: true
        type: string
jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24.x
          cache: npm
          registry-url: https://registry.npmjs.org/
      - name: Install dependencies
        run: npm ci
      - name: Build package
        run: |
          . ./scripts/repository.sh
          run_scripts --target_directory="." --scripts="build"
      - name: Check packed package
        run: |
          . ./scripts/repository.sh
          check_package_install --target_directory="."
      - name: Publish
        run: |
          . ./scripts/repository.sh
          publish_package --target_directory="." --registry="${{ inputs.registry }}"
