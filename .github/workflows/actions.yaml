name: CI/CD Pipeline
on:
  push:
    branches:
      - main
      - dev
  pull_request:

jobs:
  integrity:
    uses: ./.github/workflows/integrity.yaml
    permissions:
      contents: read
      packages: read
    secrets: inherit

  test:
    needs: integrity
    uses: ./.github/workflows/test.yaml
    permissions:
      contents: read
      packages: read
    secrets: inherit

